<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Project Swallow — Ace Combat 3: Electrosphere</title>
  <desc id="desc">Original cyan and lavender flight-interface artwork with a swept-wing aircraft, a digital horizon, and the words The Electrosphere, rebuilt.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#192843"/></linearGradient>
    <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#a2f4ff"/><stop offset=".48" stop-color="#4b8da7"/><stop offset="1" stop-color="#a69bd4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#65e5f2" stroke-opacity=".08"/></pattern>
    <radialGradient id="glow"><stop stop-color="#65e5f2" stop-opacity=".16"/><stop offset="1" stop-color="#65e5f2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" rx="12" fill="url(#sky)"/>
  <rect width="1280" height="400" rx="12" fill="url(#grid)"/>
  <ellipse cx="1010" cy="195" rx="280" ry="210" fill="url(#glow)"/>
  <g fill="none" stroke="#65e5f2">
    <path d="M30 67V30H188M1092 30h158v37M30 333v37h158m904 0h158v-37" stroke-opacity=".65"/>
    <path d="M733 282H1210M767 310h410M810 338h323M858 366h227M971 269 800 370m191-101-67 101m87-101 37 101m-17-101 141 101" stroke-opacity=".18"/>
    <circle cx="1000" cy="183" r="127" stroke-opacity=".22"/>
    <circle cx="1000" cy="183" r="110" stroke-opacity=".2" stroke-dasharray="2 13"/>
    <path d="M1000 40v30m0 226v30M855 183h30m230 0h30" stroke-opacity=".45"/>
  </g>
  <g transform="translate(1000 182) rotate(-13)">
    <path d="M0-108 17-16 111 52 35 33 17 57 29 89 0 71-29 89-17 57-35 33-111 52-17-16Z" fill="url(#wing)" fill-opacity=".22" stroke="#9cefff" stroke-width="1.8"/>
    <path d="M0-108V71M0-50 17-16 35 33M0-50-17-16-35 33M-111 52 0 3 111 52M-17 57 0 43 17 57" fill="none" stroke="#a1edff" stroke-opacity=".6"/>
    <path d="M-5-44 0-70 5-44 5-22H-5Z" fill="#b9a6ff" fill-opacity=".7"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="70" fill="#65e5f2" font-size="13" letter-spacing="4">AC3 / OPEN-SOURCE RECONSTRUCTION</text>
    <text x="60" y="151" fill="#f0f6ff" font-size="64" font-weight="700" letter-spacing="2">PROJECT</text>
    <text x="60" y="222" fill="#f0f6ff" font-size="76" font-weight="700" letter-spacing="5">SWALLOW</text>
    <path d="M64 247H662" stroke="#65e5f2" stroke-opacity=".6"/>
    <text x="64" y="279" fill="#b9a6ff" font-size="18" letter-spacing="4">ACE COMBAT 3: ELECTROSPHERE</text>
    <text x="64" y="315" fill="#d4e0ee" font-size="16" letter-spacing="2">THE ELECTROSPHERE, REBUILT.</text>
    <text x="64" y="365" fill="#7c9bae" font-size="11" letter-spacing="2">FULL CAMPAIGN / ORIGINAL FLIGHT / MODERN PCs</text>
    <text x="1168" y="350" text-anchor="end" fill="#65e5f2" font-size="11" letter-spacing="2">SYSTEM / SWALLOW</text>
    <text x="1168" y="368" text-anchor="end" fill="#cbb8f7" font-size="10" letter-spacing="2">DEVELOPMENT ACTIVE</text>
  </g>
  <rect x="64" y="335" width="34" height="3" fill="#f0b979"/>
  <rect x="104" y="335" width="12" height="3" fill="#65e5f2"/>
</svg>
