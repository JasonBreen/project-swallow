[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swallow-tools"
version = "0.14.0"
description = "Disc and archive tools for Project Swallow, an open-source AC3 reconstruction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{name = "Project Swallow contributors"}]
dependencies = []

[project.scripts]
swallow-disc = "swallow_tools.cli:main"
swallow-compare = "swallow_tools.compare:main"
swallow-bph = "swallow_tools.bph:main"
swallow-bpb = "swallow_tools.bpb:main"
swallow-exe = "swallow_tools.exe:main"
swallow-split = "swallow_tools.split:main"
swallow-psyq = "swallow_tools.psyq:main"
swallow-ulzcheck = "swallow_tools.ulzcheck:main"
swallow-inventory = "swallow_tools.inventory:main"
swallow-recompile = "swallow_tools.recompile:main"
swallow-recompcheck = "swallow_tools.recompcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
# Shared by Pylance (VS Code) and basedpyright (Antigravity/Open VSX), so both
# editors report the same diagnostics. src/ imports resolve automatically.
# "off" matches Pylance's default; see docs/editor-setup.md before raising it.
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "off"
