# splat config for ACE3.BIN, the second PS-X EXE that the boot executable
# names. Japanese Discs 1-2 and English-labeled Disc 2 share one SHA256;
# English-labeled Disc 1 differs by one byte at file offset 0xa29d8, inside
# the data subsegment, so the same boundaries apply. Measured on 2026-10-21;
# see docs/disassembly.md. Generated assembly is never committed.
name: ACE3.BIN
options:
  basename: ace3
  target_path: ace3.psexe
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: ace3.ld
  ld_dependencies: False

  find_file_boundaries: True
  gp_value: 0x800BCB74

  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.ace3.txt
  undefined_funcs_auto_path: undefined_funcs_auto.ace3.txt
  undefined_syms_auto_path: undefined_syms_auto.ace3.txt

  subalign: 2
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      # Strings, path names (\ACE.SPB;1 at 0x800103a8) and pointer tables.
      - [0x800, rodata, ace3_rodata]
      # First function 0x80025724 (jr $ra stub, lowest in-range jal target);
      # entry point 0x8002572c; last jr $ra at 0x800b0128.
      - [0x15F24, asm, ace3_text]
      # Pointer tables begin at 0x800b0130.
      - [0xA0930, data, ace3_data]
  - [0xAD800]
